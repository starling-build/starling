name: render-gate-prebuild
# After each push to main, build that commit on the runner and fill the base-binary cache, so the next PR gate
# never has to build its base (on both runners). Not a required check. NEVER cancelled: one concurrency group per sha (a shared group kept only one pending run, so nearly every prebuild was dropped and each gate built its base itself). The cache is shared by the runners of a machine (/data/gate/cache), so one runner builds a sha and the others find it.
on:
  push:
    branches: [main]
    # a push that only touches notes (docs/, *.md: the board) cannot change a binary or a score: no prebuild at all (amd-8, 2026-11-23, capacity: 12 prebuilds were queued)
    paths-ignore: ['docs/**', '**.md']
permissions:
  contents: read
concurrency:
  group: render-gate-prebuild-${{ github.sha }}
  cancel-in-progress: false
jobs:
  prebuild:
    strategy:
      fail-fast: false
      matrix:
        # amd-6 is DEDICATED to prebuilds (label prebuild; it no longer carries starling-render, so no PR gate ever queues ahead of
        # a prebuild there). starling2 (3x slower to compile: gates took 20 min there against 5 on AMD, 2026-11-21) lost the
        # starling-render label: it only prebuilds now.
        include:
          - labels: '["self-hosted","linux","prebuild"]'
    # starling2's three runners carry the gate label too, and ~20 merges an hour kept them all on prebuilds (0 gates in an hour,
    # 2026-11-21): there it builds only every 5th push; a gate that finds no base for its sha uses the nearest cached ancestor.
    runs-on: ${{ fromJSON(matrix.labels) }}
    timeout-minutes: 60
    steps:
      - name: Thin
        # (GitHub expressions have no % operator: "github.run_number % matrix.thin" made the whole workflow invalid, so NO prebuild ran from 2026-11-21 02:52Z; the modulo is shell arithmetic now)
        env:
          THIN: ${{ matrix.thin }}
        run: if [ -n "$THIN" ] && [ $((GITHUB_RUN_NUMBER % THIN)) -ne 0 ]; then echo "SKIP_PREBUILD=1" >> "$GITHUB_ENV"; echo "thinned prebuild on this runner"; fi
      - name: Update persistent clone
        if: env.SKIP_PREBUILD != '1'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          C=$HOME/clone
          pgrep -u "$(id -u)" -x git >/dev/null || find "$C/.git" -maxdepth 2 -name "*.lock" -delete 2>/dev/null || true   # stale locks from a cancelled run, only if no git of ours is running
          [ -d "$C/.git" ] || { git init -q "$C"; git -C "$C" remote add origin "https://github.com/${{ github.repository }}.git"; }
          AUTH="AUTHORIZATION: basic $(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)"
          # the token goes through the environment of the one git process (never the command line: ps shows that); a hung fetch is killed after 300 s and retried once
          gfetch() { for _t in 1 2; do GIT_CONFIG_COUNT=1 GIT_CONFIG_KEY_0=http.extraheader GIT_CONFIG_VALUE_0="$AUTH" timeout 300 git -C "$C" fetch "$@" && return 0; done; return 1; }
          gfetch -q --no-tags --depth=200 origin "$GITHUB_SHA"
          git -C "$C" checkout -q -f --detach "$GITHUB_SHA"
          git -C "$C" cat-file -e "$GITHUB_SHA^{tree}" || { echo "pushed sha missing after fetch"; exit 1; }
          gfetch -q --no-tags --depth=200 origin "$(git -C "$C" rev-parse "$GITHUB_SHA^" 2>/dev/null || echo "$GITHUB_SHA")" 2>/dev/null || true   # its parent too
          git -C "$C" clean -fdq
          # the prebuild now also draws 670 Slides decks per sha (amd-8, 2026-11-22), so the dedicated runner skips to the NEWEST main sha (any newer commit on main: skip); starling2 keeps 3
          AHEAD=${{ matrix.thin && 3 || 1 }}
          # a sha that is already behind main is not worth a build: no gate will use it as its base
          gfetch -q --no-tags --depth=200 origin main 2>/dev/null || true
          if [ "$(git -C "$C" rev-list --count "$GITHUB_SHA..FETCH_HEAD" 2>/dev/null || echo 0)" -ge "$AHEAD" ]; then echo "SKIP_PREBUILD=1" >> "$GITHUB_ENV"; echo "main is $AHEAD+ commits ahead; skipping this prebuild (a newer sha builds; gates pair with the nearest cached ancestor)"; fi
      - name: Skip when cached
        if: env.SKIP_PREBUILD != '1'
        run: |
          # (amd-8, 2026-11-23, capacity) Skip this prebuild when this sha is already cached (a gate built it as its base), or when nothing that
          # builds or scores OfficeApp changed since the newest cached ancestor: a gate scores against that ancestor anyway (render-gate.sh "BASE MISS").
          cd "$HOME/clone"; EN=$(git -c safe.directory='*' -C "${ENGINE_DIR:-/nonexistent}" rev-parse --short=10 HEAD 2>/dev/null || true); BC=/data/gate/cache/eng-$EN
          [ -n "$EN" ] && [ -d "$BC" ] || { echo "no shared cache: building"; exit 0; }
          [ -x "$BC/$GITHUB_SHA/release/OfficeApp" ] && { echo "SKIP_PREBUILD=1" >> "$GITHUB_ENV"; echo "already cached"; exit 0; }
          for a in $(git rev-list --max-count=40 "$GITHUB_SHA" | tail -n +2); do
            if [ -x "$BC/$a/release/OfficeApp" ]; then
              if git diff --name-only "$a" "$GITHUB_SHA" | grep -qvE '^(docs/|shell/|host/|registry/|macos-compat/|apps/(AppStore|Calculator|FileExplorer|FlutterDemo|ImageViewer|Settings|TaskManager|Terminal|TextEditor|VideoPlayer)App/)|\.md$'; then echo "render-relevant change since cached ${a:0:9}: building"; else echo "SKIP_PREBUILD=1" >> "$GITHUB_ENV"; echo "nothing render-relevant since cached ${a:0:9}: skipped"; fi
              exit 0
            fi
          done
          echo "no cached ancestor: building"
      - name: Prebuild
        if: env.SKIP_PREBUILD != '1'
        run: |
          set -o pipefail
          cd "$HOME/clone"
          export JOBS=${GATE_JOBS:-$(cat "$HOME/.gate-jobs" 2>/dev/null || nproc)}
          [ "$JOBS" -gt 64 ] && JOBS=64   # was 170: 6 AMD runners at 170 jobs each, with workers building, kept the box at load ~950 on 192 cores (2026-11-23)
          export JOBS BUILD_JOBS=$(( JOBS / 2 ))
          GATE_PREBUILD=1 test/tools/render-gate.sh "$GITHUB_SHA" 2>&1 | tail -20 | cut -c1-200
      - name: Merge watch
        if: env.SKIP_PREBUILD != '1' && always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: cd "$HOME/clone" && test/tools/merge-watch.sh "$GITHUB_SHA" || true
