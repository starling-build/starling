name: render-gate
# Gate for main: renders the Word corpus before and after a change on a self-hosted runner.
# pull_request only (never pull_request_target): fork PRs need approval, and the job refuses forks anyway.
on:
  pull_request:
    branches: [main]
  # merge queue (amd-8, 2026-11-23, user): one gate run tests a group of up to 4 queued PRs on top of main (GITHUB_SHA is the group's tip; its
  # base_sha is main). HEAD is a plain commit chain, not a merge, so render-gate.sh diffs BASE_SHA..HEAD and gate-rebase.sh leaves it alone.
  merge_group:
    types: [checks_requested]
permissions:
  contents: read
  issues: write
concurrency:
  group: render-gate-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true
jobs:
  # (2026-11-22, amd-8) Three jobs so that a PR with no render-relevant change never waits for a self-hosted runner:
  #  classify    (ubuntu-latest)  decides from the PR's file list, with test/tools/render-paths.txt and the gate-tooling pattern of render-gate.sh
  #  render-gate-run (self-hosted) the heavy gate; skipped when classify says "no render-relevant change"
  #  render-gate (ubuntu-latest)  the REQUIRED check (the ruleset names "render-gate"): green when the run job passed or was skipped
  classify:
    if: github.event_name == 'merge_group' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      heavy: ${{ steps.c.outputs.heavy }}
      tool: ${{ steps.c.outputs.tool }}
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: test/tools/render-paths.txt
          sparse-checkout-cone-mode: false
      - id: c
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          if [ "${{ github.event_name }}" = merge_group ]; then
            gh api --paginate "repos/${{ github.repository }}/compare/${{ github.event.merge_group.base_sha }}...${{ github.event.merge_group.head_sha }}" -q '.files[]|.filename, (.previous_filename // empty)' | sort -u > files.txt
          else
            gh api --paginate "repos/${{ github.repository }}/pulls/${{ github.event.pull_request.number }}/files" -q '.[]|.filename, (.previous_filename // empty)' | sort -u > files.txt
          fi
          n=$(wc -l < files.txt); echo "changed files: $n"; head -5 files.txt
          PAT=$(grep -vE '^#|^$' test/tools/render-paths.txt | paste -sd'|')
          TOOL='^\.github/workflows/render-gate|^test/tools/(render-gate|docx-pair|docx-combine|docx-line-match|docx-line-sweep|gen-render-paths|slides-gate|pptx-combine)|^test/docx-line-match\.py|^test/pptx-line-match\.py|^test/tools/render-paths\.txt'
          # a change to the gate tooling itself still builds/self-tests in its pull_request run (a broken gate would fail every group)
          if grep -qE "$TOOL" files.txt; then echo tool=1 >> "$GITHUB_OUTPUT"; else echo tool=0 >> "$GITHUB_OUTPUT"; fi
          if [ "$n" -eq 0 ] || grep -qE "$PAT|$TOOL" files.txt; then echo heavy=1 >> "$GITHUB_OUTPUT"; echo "render-relevant: the gate runs"; else echo heavy=0 >> "$GITHUB_OUTPUT"; echo "no render-relevant change: no runner needed"; fi
  render-gate-run:
    needs: classify
    # (amd-8, 2026-11-23, coordinator) with a merge queue the pull_request run takes NO self-hosted runner unless it changes the gate tooling: the group run builds and renders
    if: needs.classify.outputs.heavy == '1' && (github.event_name == 'merge_group' || needs.classify.outputs.tool == '1')
    runs-on: [self-hosted, linux, starling-render]
    timeout-minutes: 90
    steps:
      # One persistent clone per runner ($HOME/clone): fetch the two commits into it instead of a fresh checkout every run.
      - name: Update persistent clone
        env:
          GH_TOKEN: ${{ github.token }}
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha }}
        run: |
          set -e
          C=$HOME/clone
          pgrep -u "$(id -u)" -x git >/dev/null || find "$C/.git" -maxdepth 2 -name "*.lock" -delete 2>/dev/null || true   # stale locks from a cancelled run, only if no git of ours is running
          # a warm build of main left running by the last job (gate-warm.sh) reads this clone: stop it before the checkout changes the files
          OP=; OR=; read -r OP OR < "$HOME/scratch/gate/lock.owner" 2>/dev/null || true
          if [ "$OR" = prebuild ] && [ -n "$OP" ] && kill -0 "$OP" 2>/dev/null; then kt() { local c; for c in $(pgrep -P "$1" 2>/dev/null); do kt "$c"; done; kill -TERM "$1" 2>/dev/null || true; }; kt "$OP"; fi
          [ -d "$C/.git" ] || { git init -q "$C"; git -C "$C" remote add origin "https://github.com/${{ github.repository }}.git"; }
          AUTH="AUTHORIZATION: basic $(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)"
          # the token goes through the environment of the one git process (never the command line: ps shows that); a hung fetch is killed after 300 s and retried once
          gfetch() { for _t in 1 2; do GIT_CONFIG_COUNT=1 GIT_CONFIG_KEY_0=http.extraheader GIT_CONFIG_VALUE_0="$AUTH" timeout 300 git -C "$C" fetch "$@" && return 0; done; return 1; }
          gfetch -q --no-tags --depth=200 origin "$GITHUB_SHA" "$BASE_SHA"
          git -C "$C" checkout -q -f --detach "$GITHUB_SHA"
          git -C "$C" clean -fdq
      - name: Rebase the test merge onto a cached base
        # (amd-8, 2026-11-23) main moves every few minutes, so the merge's first parent is rarely cached and every gate built and rendered a fresh base (40-50 min runs).
        # Re-make the test merge on the newest cached ancestor of that parent: the gate then compares exactly the PR's change. GATE_REBASE=0 turns it off.
        run: cd "$HOME/clone" && bash test/tools/gate-rebase.sh 2>&1 | tail -3 || true
      - name: Group PR bodies (merge queue)
        # a group run has no PR_BODY: read the body of every PR whose commit is in the group, so ACCEPT lines (waivers) keep living in PR bodies
        if: github.event_name == 'merge_group'
        env:
          GH_TOKEN: ${{ github.token }}
          GB: ${{ github.event.merge_group.base_sha }}
          GH_: ${{ github.event.merge_group.head_sha }}
        run: |
          G=$HOME/scratch/group; rm -rf "$G"; mkdir -p "$G"
          for c in $(gh api --paginate "repos/${{ github.repository }}/compare/$GB...$GH_" -q '.commits[].sha'); do
            for n in $(gh api "repos/${{ github.repository }}/commits/$c/pulls" -q '.[].number' 2>/dev/null); do
              [ -f "$G/$n.body" ] || gh api "repos/${{ github.repository }}/pulls/$n" -q '.body // ""' > "$G/$n.body" 2>/dev/null || true
            done
          done
          ls "$G" | tr '\n' ' '; echo
      - name: Render gate
        env:
          GH_TOKEN: ${{ github.token }}
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha }}
          PR_BODY: ${{ github.event.pull_request.body }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          # no merge queue any more: every PR runs the full gate (named documents + sample) against its base.
          GATE_TARGETS_ONLY: '0'
          # under a merge queue the pull_request run only builds; the full render runs once for the group
          GATE_LIGHT: ${{ github.event_name == 'pull_request' && '1' || '0' }}
        run: |
          set -o pipefail
          cd "$HOME/clone"
          export JOBS=${GATE_JOBS:-$(cat "$HOME/.gate-jobs" 2>/dev/null || nproc)}; [ -n "$BUILD_JOBS" ] || { BUILD_JOBS=$(( JOBS / 2 )); [ "$BUILD_JOBS" -lt 30 ] && BUILD_JOBS=30; }; export BUILD_JOBS
          [ "$JOBS" -gt 170 ] && JOBS=170
          # (amd-8, 2026-11-23, starling-bd) the AMD box (192 threads) runs 5 gates plus prebuilds beside the workers' builds: load ~950. 24 render jobs per run there; starling2 (48 threads) keeps its own setting.
          [ "$(nproc)" -ge 128 ] && { [ "$JOBS" -gt 16 ] && JOBS=16; [ "$BUILD_JOBS" -gt 24 ] && BUILD_JOBS=24; export BUILD_JOBS; }   # 2026-11-23: 6 runners here sat at load 450-550; 16 jobs + 24 build jobs each
          test/tools/render-gate.sh "$BASE_SHA" 2>&1 | tail -40 | cut -c1-200
      - name: Warm this runner's scratch on current main
        if: always() && github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # (amd-8, 2026-11-22) after the gate, while the runner is idle: build current main in the persistent scratch, detached,
          # so the next PR here compiles only its own diff. A starting gate kills it (render-gate.sh), so it never delays a gate.
          C=$HOME/clone
          AUTH="AUTHORIZATION: basic $(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)"
          GIT_CONFIG_COUNT=1 GIT_CONFIG_KEY_0=http.extraheader GIT_CONFIG_VALUE_0="$AUTH" timeout 120 git -C "$C" fetch -q --no-tags --depth=50 origin main || exit 0
          M=$(git -C "$C" rev-parse FETCH_HEAD) || exit 0
          git -C "$C" show "$M:test/tools/gate-warm.sh" > "$HOME/scratch/gate-warm-run.sh" 2>/dev/null || exit 0
          setsid nohup bash "$HOME/scratch/gate-warm-run.sh" "$M" > /dev/null 2>&1 < /dev/null &
          exit 0
  render-gate:
    needs: [classify, render-gate-run]
    if: always() && (github.event_name == 'merge_group' || github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - run: |
          echo "classify=${{ needs.classify.result }} run=${{ needs.render-gate-run.result }}"
          [ "${{ needs.classify.result }}" = success ] || exit 1
          case "${{ needs.render-gate-run.result }}" in success|skipped) ;; *) exit 1;; esac
