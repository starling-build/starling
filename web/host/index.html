<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Starling</title>
<style>
  html, body { margin: 0; height: 100%; background: #101418; }
  canvas { display: block; width: 100vw; height: 100vh; touch-action: none; }
</style>
</head>
<body>
<canvas id="starling"></canvas>
<script type="module">
  // A trap inside a frame or an event handler surfaces here, not in the
  // promise below; without the stack it is only 'unreachable'.
  window.addEventListener('error', (event) => {
    console.error(String(event.error?.stack || event.message));
  });
  import { startStarling } from './starling.js';
  startStarling({
    canvas: document.getElementById('starling'),
    app: 'app.wasm',
    skwasmBase: 'skwasm/',
    // The first font is also the fallback for any family not listed.
    fonts: [
      { url: 'fonts/DejaVuSans.ttf', families: ['DejaVu Sans'] },
      { url: 'fonts/CupertinoIcons.ttf', families: ['CupertinoIcons'] },
    ],
  }).then(() => { document.title = 'Starling — running'; })
    .catch((error) => {
      console.error(String(error.stack || error));
      document.title = 'Starling — failed';
      document.body.append(Object.assign(document.createElement('pre'), {
        textContent: String(error.stack || error),
        style: 'color:#ef5350;padding:16px;white-space:pre-wrap',
      }));
    });
</script>
</body>
</html>
